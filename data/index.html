<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>attak-iot-firmware</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      background: #0b0d10;
      color: #e6e6e6;
    }
    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #23262b;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
    #connIndicator { font-size: 12px; padding: 4px 10px; border-radius: 999px; }
    #connIndicator.live { background: #113322; color: #4ade80; }
    #connIndicator.mock { background: #332a11; color: #facc15; }
    #connIndicator.offline { background: #331111; color: #f87171; }

    #layout { display: flex; min-height: calc(100vh - 53px); }
    #sidebar { width: 180px; border-right: 1px solid #23262b; background: #111318; }
    #sidebar .row {
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      border-left: 3px solid transparent;
      font-size: 13px;
    }
    #sidebar .row.active { background: #1c2028; border-left-color: #6ea8fe; }
    #sidebar .dot { width: 8px; height: 8px; border-radius: 50%; }

    #main { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 20px; max-width: 760px; }
    #detail { border: 1px solid #23262b; border-radius: 10px; padding: 20px; }
    #detail .sub { font-size: 11px; color: #8b8f98; text-transform: uppercase; letter-spacing: 0.06em; }
    #detail .name { font-size: 22px; font-weight: 600; margin: 4px 0 14px; }
    #detail .status { font-size: 14px; margin-bottom: 8px; }
    #detail .detailtext { font-size: 13px; color: #b0b3b8; margin-bottom: 16px; }
    #detail .updated { font-size: 11px; color: #5b5f68; }
    #detail .attack {
      margin: 4px 0 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #detail button.toggle {
      font-family: inherit;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #3a3f48;
      background: #1c2028;
      color: #e6e6e6;
      cursor: pointer;
    }
    #detail button.toggle:hover:not(:disabled) { border-color: #6ea8fe; }
    #detail button.toggle.stop { border-color: #7f1d1d; background: #2a1515; color: #fca5a5; }
    #detail button.toggle:disabled { opacity: 0.45; cursor: not-allowed; }
    #detail .offline { font-size: 11px; color: #8b8f98; }
    #detail .output {
      padding-top: 12px;
      border-top: 1px dashed #2c3038;
    }
    #detail .outtext {
      margin-top: 6px;
      font-size: 12px;
      color: #b0b3b8;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #logHeading { font-size: 11px; color: #5b5f68; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
    #logPane {
      background: #0e1013;
      border: 1px solid #23262b;
      border-radius: 6px;
      padding: 10px;
      flex: 1;
      min-height: 180px;
      overflow-y: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>attak-iot-firmware</h1>
    <span id="connIndicator">…</span>
  </header>
  <div id="layout">
    <div id="sidebar"></div>
    <div id="main">
      <div id="detail"></div>
      <div>
        <div id="logHeading">event log</div>
        <div id="logPane"></div>
      </div>
    </div>
  </div>

  <script>
    // ---------------------------------------------------------------
    // Data source: real WebSocket, mock fallback when no device is reachable
    // ---------------------------------------------------------------
    const MODULE_META = {
      cc1101: { label: "CC1101", sub: "Sub-GHz RF" },
      nrf24: { label: "NRF24", sub: "2.4GHz jammer", attack: true },
      pn532: { label: "PN532", sub: "NFC" },
      ir: { label: "IR", sub: "IR RX/TX" },
    };

    const state = {
      cc1101: { enabled: false, connected: false, detail: "waiting…", output: "", lastUpdateMs: 0 },
      nrf24: { enabled: false, connected: false, detail: "waiting…", output: "", lastUpdateMs: 0 },
      pn532: { enabled: false, connected: false, detail: "waiting…", output: "", lastUpdateMs: 0 },
      ir: { enabled: false, connected: false, detail: "waiting…", output: "", lastUpdateMs: 0 },
    };
    const log = []; // {t, module, enabled, connected, detail}
    let selectedModule = "cc1101";
    let deviceLive = false;
    let ws = null;
    let reconnectTimer = null;

    function applyUpdate(status) {
      if (!(status.module in state)) return;
      const prev = state[status.module];
      const next = {
        enabled: !!status.enabled,
        connected: !!status.connected,
        detail: status.detail || "",
        output: status.output || "",
        lastUpdateMs: status.lastUpdateMs || Date.now(),
      };
      state[status.module] = next;

      // Log only state transitions — the jammer publishes its current
      // channel several times a second, which would otherwise flood the log.
      const transitioned =
        prev.enabled !== next.enabled ||
        prev.connected !== next.connected ||
        prev.detail !== next.detail;
      if (transitioned) {
        log.push({
          t: new Date(),
          module: status.module,
          enabled: next.enabled,
          connected: next.connected,
          detail: next.detail,
        });
        if (log.length > 100) log.shift();
      }

      if (transitioned || prev.output !== next.output) scheduleRender();
    }

    // Coalesce bursts of status messages into at most one render per 100ms.
    let renderTimer = null;
    function scheduleRender() {
      if (renderTimer) return;
      renderTimer = setTimeout(() => {
        renderTimer = null;
        render();
      }, 100);
    }

    function sendToggle() {
      if (!deviceLive || !ws || ws.readyState !== 1) return;
      const module = selectedModule;
      const cmd = state[module].enabled ? "disable" : "enable";
      ws.send(JSON.stringify({ module, cmd }));
    }

    function setConn(mode) {
      const el = document.getElementById("connIndicator");
      el.className = mode;
      el.textContent = mode === "live"
        ? "● device connected"
        : mode === "offline"
          ? "○ device offline"
          : "◐ simulated data";
    }

    let mockTimer = null;
    function startMock() {
      setConn("mock");
      const names = Object.keys(state);
      let i = 0;
      mockTimer = setInterval(() => {
        const name = names[i % names.length];
        i++;
        applyUpdate({
          module: name,
          connected: Math.random() > 0.3,
          detail: Math.random() > 0.5 ? "ok" : "not implemented",
          lastUpdateMs: Date.now(),
        });
      }, 1500);
    }

    const mockFallback = setTimeout(startMock, 1500);

    // Auto-reconnect: a device reboot or Wi-Fi blip must not leave the
    // dashboard permanently "offline" until a manual page refresh.
    function connect() {
      ws = new WebSocket(`ws://${location.host}/ws`);
      ws.onopen = () => {
        clearTimeout(mockFallback);
        if (mockTimer) clearInterval(mockTimer);
        if (reconnectTimer) {
          clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }
        deviceLive = true;
        setConn("live");
        scheduleRender(); // re-enable the attack controls
      };
      ws.onmessage = (event) => {
        let status;
        try {
          status = JSON.parse(event.data);
        } catch {
          return;
        }
        applyUpdate(status);
      };
      ws.onclose = () => {
        deviceLive = false;
        setConn("offline");
        scheduleRender();
        if (!reconnectTimer) {
          reconnectTimer = setTimeout(() => {
            reconnectTimer = null;
            connect();
          }, 2000);
        }
      };
      ws.onerror = () => {}; // onclose handles the retry
    }

    connect();

    // ---------------------------------------------------------------
    // Render — sidebar module list + selected-module detail + event log
    // ---------------------------------------------------------------
    function renderSidebar() {
      const el = document.getElementById("sidebar");
      el.replaceChildren(...Object.keys(state).map((name) => {
        const m = state[name];
        const row = document.createElement("div");
        row.className = `row${name === selectedModule ? " active" : ""}`;
        row.dataset.module = name;

        const dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = m.enabled
          ? (m.connected ? "#f97316" : "#ef4444")
          : (m.connected ? "#4ade80" : "#6b7280");

        const label = document.createElement("span");
        label.textContent = MODULE_META[name].label;

        row.append(dot, label);
        row.onclick = () => {
          selectedModule = name;
          render();
        };
        return row;
      }));
    }

    function renderDetail() {
      const m = state[selectedModule];
      const meta = MODULE_META[selectedModule];
      const el = document.getElementById("detail");
      el.replaceChildren();

      const sub = document.createElement("div");
      sub.className = "sub";
      sub.textContent = meta.sub;

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = meta.label;

      const status = document.createElement("div");
      status.className = "status";
      if (meta.attack) {
        if (m.enabled && m.connected) {
          status.textContent = "● Jamming";
          status.style.color = "#f97316";
        } else if (m.enabled) {
          status.textContent = "○ Hardware not responding";
          status.style.color = "#ef4444";
        } else {
          status.textContent = "○ Idle";
          status.style.color = "#6b7280";
        }
      } else {
        status.textContent = m.connected ? "● Connected" : "○ Disconnected";
        status.style.color = m.connected ? "#4ade80" : "#6b7280";
      }

      const detailText = document.createElement("div");
      detailText.className = "detailtext";
      detailText.textContent = m.detail;

      const updated = document.createElement("div");
      updated.className = "updated";
      updated.textContent = `last update: ${m.lastUpdateMs ? new Date(m.lastUpdateMs).toLocaleTimeString() : "—"}`;

      el.append(sub, name, status, detailText, updated);

      if (meta.attack) {
        const attack = document.createElement("div");
        attack.className = "attack";

        const toggle = document.createElement("button");
        toggle.className = `toggle${m.enabled ? " stop" : ""}`;
        toggle.disabled = !deviceLive;
        toggle.textContent = m.enabled ? "Stop jamming" : "Start jamming";
        toggle.onclick = sendToggle;
        attack.append(toggle);

        if (!deviceLive) {
          const offline = document.createElement("span");
          offline.className = "offline";
          offline.textContent = "device offline — controls disabled";
          attack.append(offline);
        }
        el.append(attack);
      }

      const output = document.createElement("div");
      output.className = "output";
      const outputSub = document.createElement("div");
      outputSub.className = "sub";
      outputSub.textContent = "output";
      const outText = document.createElement("div");
      outText.className = "outtext";
      outText.textContent = m.output || "—";
      output.append(outputSub, outText);
      el.append(output);
    }

    function renderLog() {
      const el = document.getElementById("logPane");
      el.replaceChildren(...log.slice().reverse().map((e) => {
        const row = document.createElement("div");
        const phase = e.enabled
          ? (e.connected ? "jamming" : "enabled")
          : (e.connected ? "connected" : "disconnected");
        row.style.color = e.enabled ? "#f97316" : (e.connected ? "#4ade80" : "#6b7280");
        row.textContent = `[${e.t.toLocaleTimeString()}] ${e.module} → ${phase} (${e.detail})`;
        return row;
      }));
    }

    function render() {
      renderSidebar();
      renderDetail();
      renderLog();
    }

    render();
  </script>
</body>
</html>
