<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>attak-iot-firmware</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-monospace, "SF Mono", Consolas, monospace; background: #0b0d10; color: #e6e6e6; }
    header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #23262b; gap: 12px; }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.02em; }
    #connIndicator { font-size: 12px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
    #connIndicator.live { background: #113322; color: #4ade80; }
    #connIndicator.connecting, #connIndicator.reconnecting { background: #332a11; color: #facc15; }
    #connIndicator.offline { background: #331113; color: #f87171; }

    #layout { display: flex; min-height: calc(100vh - 53px); }
    #sidebar { width: 190px; border-right: 1px solid #23262b; background: #111318; flex-shrink: 0; }
    #sidebar .row { padding: 12px 16px; cursor: pointer; display: flex; align-items: center; gap: 8px; border-left: 3px solid transparent; font-size: 13px; background: none; border-top: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; color: inherit; }
    #sidebar .row.active { background: #1c2028; border-left-color: #6ea8fe; }
    #sidebar .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    #sidebar .label { flex: 1; }
    #sidebar .badge { font-size: 10px; color: #facc15; }

    #main { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 18px; max-width: 860px; min-width: 0; }
    section { border: 1px solid #23262b; border-radius: 10px; padding: 16px; min-width: 0; }
    .sub { font-size: 11px; color: #8b8f98; text-transform: uppercase; letter-spacing: 0.06em; }
    .name { font-size: 20px; font-weight: 600; margin: 4px 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
    .metric { border: 1px solid #23262b; border-radius: 8px; padding: 10px; }
    .metric .k { font-size: 11px; color: #8b8f98; }
    .metric .v { font-size: 18px; margin-top: 4px; }
    .status { font-size: 14px; margin-bottom: 6px; }
    .detailtext { font-size: 13px; color: #b0b3b8; margin-bottom: 10px; word-break: break-word; }
    .updated { font-size: 11px; color: #5b5f68; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    button { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 7px; border: 1px solid #2f343c; background: #1a1e24; color: #e6e6e6; cursor: pointer; }
    button:focus-visible { outline: 2px solid #6ea8fe; outline-offset: 2px; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .warn { color: #facc15; }
    .err { color: #f87171; }
    .ok { color: #4ade80; }
    table { border-collapse: collapse; width: 100%; font-size: 12px; }
    th, td { border-bottom: 1px solid #23262b; padding: 6px 8px; text-align: left; }
    .scrollx { overflow-x: auto; }
    pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 12px; color: #b0b3b8; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    select { font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 7px; border: 1px solid #2f343c; background: #1a1e24; color: #e6e6e6; }
    #logPane { background: #0e1013; border: 1px solid #23262b; border-radius: 6px; padding: 10px; max-height: 320px; overflow-y: auto; font-size: 12px; }
    .logline { display: flex; gap: 8px; padding: 2px 0; border-bottom: 1px solid #171a1f; }
    .logline .t { color: #5b5f68; flex-shrink: 0; }
    .logline .m { color: #8b8f98; flex-shrink: 0; }
    .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid #2f343c; }
    .pill.warn { border-color: #6b5a11; }
    .pill.err { border-color: #6b1111; }

    @media (max-width: 700px) {
      #layout { flex-direction: column; }
      #sidebar { width: 100%; border-right: 0; border-bottom: 1px solid #23262b; display: flex; overflow-x: auto; }
      #sidebar .row { border-left: 0; border-bottom: 3px solid transparent; white-space: nowrap; }
      #sidebar .row.active { border-left-color: transparent; border-bottom-color: #6ea8fe; }
      #main { padding: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>attak-iot-firmware</h1>
    <span id="connIndicator" class="connecting">Đang kết nối…</span>
  </header>
  <div id="layout">
    <nav id="sidebar" aria-label="Danh sách module"></nav>
    <main id="main">
      <section id="overview" aria-label="Tổng quan">
        <div class="sub">Tổng quan</div>
        <div id="overviewGrid" class="grid"></div>
      </section>
      <section id="detail" aria-label="Chi tiết module"></section>
      <section id="result" aria-label="Kết quả"></section>
      <section id="logSection" aria-label="Nhật ký">
        <div class="toolbar">
          <span class="sub">Nhật ký</span>
          <label for="logFilter" class="sub">Lọc</label>
          <select id="logFilter"></select>
          <button id="clearLog" type="button">Xóa log</button>
          <button id="exportLog" type="button">Xuất log</button>
          <button id="exportResult" type="button">Xuất kết quả</button>
        </div>
        <div id="logPane" role="log" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <script src="/dashboard.js" defer></script>
</body>
</html>
