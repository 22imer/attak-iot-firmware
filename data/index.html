<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>attak-iot-firmware</title>
  <style>
    /* ---- Theme tokens ---- */
    :root {
      --bg: #0b0d10;
      --bg-elev: #111318;
      --bg-elev-2: #171a20;
      --card: #111318;
      --card-border: #23262b;
      --card-border-strong: #2f343c;
      --text: #e6e8ec;
      --text-dim: #9aa0aa;
      --text-faint: #646a74;
      --accent: #6ea8fe;
      --accent-weak: #1b2740;
      --ok: #4ade80;
      --ok-bg: #0f2a1b;
      --warn: #facc15;
      --warn-bg: #2b2410;
      --err: #f87171;
      --err-bg: #2b1314;
      --off: #5b5f68;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    }
    html[data-theme="light"] {
      --bg: #f4f6f9;
      --bg-elev: #ffffff;
      --bg-elev-2: #eef1f5;
      --card: #ffffff;
      --card-border: #e2e6ec;
      --card-border-strong: #cdd3dc;
      --text: #1a1f26;
      --text-dim: #5a626d;
      --text-faint: #9099a4;
      --accent: #2563eb;
      --accent-weak: #e3ecff;
      --ok: #16a34a;
      --ok-bg: #e4f7ea;
      --warn: #b7791f;
      --warn-bg: #fbf2d9;
      --err: #dc2626;
      --err-bg: #fbe4e4;
      --off: #a3abb5;
      --shadow: 0 1px 2px rgba(20,30,50,.06), 0 8px 24px rgba(20,30,50,.08);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: var(--sans); font-size: 14px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- Header ---- */
    header {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 14px;
      padding: 12px 20px;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
    .brand .mark {
      width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px;
      font-family: var(--mono);
    }
    .brand h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand .tag { font-size: 11px; color: var(--text-faint); white-space: nowrap; }

    #connIndicator {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 12px; font-weight: 550; padding: 6px 12px; border-radius: 999px; white-space: nowrap;
      border: 1px solid transparent;
    }
    #connIndicator .led { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 0 currentColor; }
    #connIndicator.live { background: var(--ok-bg); color: var(--ok); }
    #connIndicator.live .led { animation: pulse 2s infinite; }
    #connIndicator.connecting, #connIndicator.reconnecting { background: var(--warn-bg); color: var(--warn); }
    #connIndicator.offline { background: var(--err-bg); color: var(--err); }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 70%, transparent); } 70% { box-shadow: 0 0 0 6px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

    .icon-btn {
      display: grid; place-items: center; width: 36px; height: 36px; flex-shrink: 0;
      border-radius: 9px; border: 1px solid var(--card-border-strong); background: var(--bg-elev);
      color: var(--text-dim); cursor: pointer; font-size: 16px; line-height: 1;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--accent); }
    .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ---- Layout ---- */
    #layout { display: flex; align-items: flex-start; gap: 0; min-height: calc(100vh - 57px); }
    #sidebar {
      width: 210px; flex-shrink: 0; padding: 14px 10px; position: sticky; top: 57px;
      align-self: stretch; border-right: 1px solid var(--card-border);
    }
    #sidebar .heading { font-size: 10px; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; color: var(--text-faint); padding: 4px 10px 10px; }
    .mod-row {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 10px 12px; margin-bottom: 4px; border-radius: 10px;
      background: none; border: 1px solid transparent; color: inherit; cursor: pointer; text-align: left;
      transition: background .12s, border-color .12s;
    }
    .mod-row:hover { background: var(--bg-elev); }
    .mod-row.active { background: var(--accent-weak); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
    .mod-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .mod-row .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 6px -1px currentColor; }
    .mod-row .meta { flex: 1; min-width: 0; }
    .mod-row .label { font-size: 13px; font-weight: 600; }
    .mod-row .sub { font-size: 11px; color: var(--text-faint); }
    .mod-row .badge { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--warn); background: var(--warn-bg); padding: 2px 6px; border-radius: 6px; }

    #main { flex: 1; min-width: 0; padding: 20px; display: flex; flex-direction: column; gap: 16px; max-width: 920px; }

    .card { background: var(--card); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 18px; }
    .card-title { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); margin: 0 0 14px; }

    /* ---- Overview stat cards ---- */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
    .stat {
      border: 1px solid var(--card-border); border-radius: var(--radius-sm); padding: 14px;
      background: var(--bg-elev); display: flex; flex-direction: column; gap: 6px;
      border-left: 3px solid var(--off);
    }
    .stat.ready { border-left-color: var(--ok); }
    .stat.error { border-left-color: var(--err); }
    .stat.stale { border-left-color: var(--warn); }
    .stat .v { font-size: 28px; font-weight: 700; font-family: var(--mono); line-height: 1; }
    .stat .k { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; }

    /* ---- Detail ---- */
    .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .detail-head .name { font-size: 22px; font-weight: 700; margin: 0; }
    .detail-head .sub { font-size: 12px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .05em; }
    .health-badge {
      display: inline-flex; align-items: center; gap: 7px; flex-shrink: 0;
      font-size: 13px; font-weight: 600; padding: 7px 13px; border-radius: 999px;
      background: var(--bg-elev-2); border: 1px solid var(--card-border-strong);
    }
    .health-badge .dot { width: 9px; height: 9px; border-radius: 50%; }
    .health-badge.ready { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
    .health-badge.error { background: var(--err-bg); color: var(--err); border-color: transparent; }
    .health-badge.off { color: var(--text-dim); }

    .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; margin-bottom: 14px; }
    .kv dt { color: var(--text-faint); }
    .kv dd { margin: 0; color: var(--text); word-break: break-word; }
    .kv dd .mono { font-family: var(--mono); font-size: 12px; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
      background: var(--bg-elev-2); border: 1px solid var(--card-border-strong); color: var(--text-dim);
    }
    .chip.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
    .chip.err { background: var(--err-bg); color: var(--err); border-color: transparent; }
    .chip.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
    .chip.run { background: var(--accent-weak); color: var(--accent); border-color: transparent; }
    .chip .spin { width: 10px; height: 10px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .controls { display: flex; flex-wrap: wrap; gap: 8px; }
    .controls fieldset { flex-basis: 100%; min-width: 0; margin: 0; padding: 12px; border: 1px solid var(--card-border-strong); border-radius: 9px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .controls legend { padding: 0 6px; font-size: 13px; color: var(--text-dim); }
    .controls label { display: flex; flex-direction: column; gap: 5px; min-width: 0; font-size: 13px; }
    .controls input { box-sizing: border-box; min-width: 0; }
    .controls fieldset:disabled { opacity: .4; }
    button.btn { font: inherit; font-size: 13px; font-weight: 550; padding: 9px 15px; border-radius: 9px; border: 1px solid var(--card-border-strong); background: var(--bg-elev); color: var(--text); cursor: pointer; transition: background .12s, border-color .12s; }
    button.btn:hover:not(:disabled) { border-color: var(--accent); }
    button.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button.btn:disabled { opacity: .4; cursor: not-allowed; }
    button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.btn.danger:hover:not(:disabled) { border-color: var(--err); color: var(--err); }

    /* ---- Action picker (select task → configure → run) ---- */
    .action-picker { margin-top: 16px; display: flex; flex-direction: column; gap: 14px; }
    .picker-head { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); }
    .picker-groups { display: flex; flex-direction: column; gap: 12px; }
    .action-group { border: 1px solid var(--card-border-strong); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .action-group.disruptive { border-color: color-mix(in srgb, var(--err) 45%, var(--card-border-strong)); background: color-mix(in srgb, var(--err-bg) 45%, transparent); }
    .group-head { display: flex; align-items: center; gap: 8px; }
    .group-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); }
    .action-group.disruptive .group-title { color: var(--err); }
    .action-group.disruptive .group-title::before { content: "⚠ "; }
    .group-note { font-size: 12px; color: var(--err); margin-top: -2px; }
    .action-opt {
      display: flex; align-items: flex-start; gap: 11px; width: 100%; text-align: left;
      padding: 11px 13px; border-radius: 9px; cursor: pointer;
      border: 1px solid var(--card-border-strong); background: var(--bg-elev); color: inherit;
      font: inherit; transition: border-color .12s, background .12s;
    }
    .action-opt:hover { border-color: var(--accent); }
    .action-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .action-opt.selected { border-color: var(--accent); background: var(--accent-weak); }
    .action-group.disruptive .action-opt.selected { border-color: var(--err); background: color-mix(in srgb, var(--err-bg) 80%, transparent); }
    .opt-radio { width: 16px; height: 16px; margin-top: 2px; flex-shrink: 0; border-radius: 50%; border: 2px solid var(--text-faint); background: transparent; transition: border-color .12s; }
    .action-opt.selected .opt-radio { border-color: var(--accent); background: radial-gradient(circle at center, var(--accent) 0 4px, transparent 5px); }
    .action-group.disruptive .action-opt.selected .opt-radio { border-color: var(--err); background: radial-gradient(circle at center, var(--err) 0 4px, transparent 5px); }
    .opt-body { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .opt-label { font-size: 14px; font-weight: 600; }
    .opt-meta { display: flex; flex-wrap: wrap; gap: 6px; }
    .opt-meta .tag { font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--bg-elev-2); color: var(--text-faint); letter-spacing: .02em; }
    .opt-meta .tag.warn { background: var(--warn-bg); color: var(--warn); }
    .action-config { display: flex; flex-direction: column; gap: 12px; }
    .action-config fieldset { min-width: 0; margin: 0; padding: 12px; border: 1px solid var(--card-border-strong); border-radius: 9px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .action-config legend { padding: 0 6px; font-size: 13px; color: var(--text-dim); }
    .action-config label { display: flex; flex-direction: column; gap: 5px; min-width: 0; font-size: 13px; }
    .action-config input { box-sizing: border-box; min-width: 0; }
    .run-row { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .run-hint { font-size: 12px; color: var(--text-faint); }

    /* ---- Result ---- */
    .result-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .result-meta { font-size: 11px; color: var(--text-faint); font-family: var(--mono); display: flex; flex-wrap: wrap; gap: 4px 10px; }
    table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
    th, td { border-bottom: 1px solid var(--card-border); padding: 8px 10px; text-align: left; }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-faint); font-weight: 600; }
    tbody tr:hover { background: var(--bg-elev); }
    .scrollx { overflow-x: auto; border-radius: var(--radius-sm); }
    pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 12.5px; font-family: var(--mono); color: var(--text-dim); background: var(--bg-elev); padding: 12px; border-radius: var(--radius-sm); }
    .empty { font-size: 13px; color: var(--text-faint); padding: 8px 0; }

    /* RSSI bars */
    .rssi-list { display: flex; flex-direction: column; gap: 7px; }
    .rssi-row { display: grid; grid-template-columns: minmax(90px, 1.3fr) 1fr auto; align-items: center; gap: 10px; font-size: 12.5px; }
    .rssi-row .ssid { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rssi-row .lock { color: var(--text-faint); font-size: 11px; }
    .rssi-track { height: 8px; border-radius: 999px; background: var(--bg-elev-2); overflow: hidden; }
    .rssi-fill { height: 100%; border-radius: 999px; }
    .rssi-row .dbm { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); text-align: right; min-width: 56px; }

    /* ---- Log ---- */
    .log-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .log-toolbar .grow { flex: 1; min-width: 120px; }
    select, input[type="search"], .controls input, .action-config input {
      font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 8px;
      border: 1px solid var(--card-border-strong); background: var(--bg-elev); color: var(--text); width: 100%;
    }
    select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    #logPane { background: var(--bg-elev); border: 1px solid var(--card-border); border-radius: var(--radius-sm); padding: 6px 10px; max-height: 340px; overflow-y: auto; }
    .logline { display: grid; grid-template-columns: auto auto auto 1fr; gap: 10px; align-items: baseline; padding: 5px 2px; border-bottom: 1px solid color-mix(in srgb, var(--card-border) 60%, transparent); font-size: 12.5px; }
    .logline:last-child { border-bottom: 0; }
    .logline .t { color: var(--text-faint); font-family: var(--mono); font-size: 11.5px; }
    .logline .m { color: var(--text-dim); font-weight: 600; min-width: 48px; }
    .logline .ty { font-size: 10px; text-transform: uppercase; letter-spacing: .03em; padding: 1px 6px; border-radius: 5px; background: var(--bg-elev-2); color: var(--text-faint); }
    .logline .ty.command { color: var(--accent); }
    .logline .ty.state { color: var(--ok); }
    .logline .ty.protocol, .logline .ty.transport { color: var(--warn); }
    .logline .c { color: var(--text); word-break: break-word; }

    /* ---- Toasts ---- */
    #toasts { position: fixed; top: 68px; right: 16px; z-index: 50; display: flex; flex-direction: column; gap: 8px; max-width: min(340px, calc(100vw - 32px)); }
    .toast {
      display: flex; align-items: flex-start; gap: 10px; padding: 11px 13px; border-radius: 10px;
      background: var(--bg-elev-2); border: 1px solid var(--card-border-strong); box-shadow: var(--shadow);
      font-size: 13px; animation: toastIn .18s ease-out; border-left: 3px solid var(--accent);
    }
    .toast.ok { border-left-color: var(--ok); }
    .toast.warn { border-left-color: var(--warn); }
    .toast.err { border-left-color: var(--err); }
    .toast .tc { flex: 1; min-width: 0; }
    .toast .th { font-weight: 650; margin-bottom: 1px; }
    .toast .tb { color: var(--text-dim); font-size: 12px; word-break: break-word; }
    .toast .tx { background: none; border: 0; color: var(--text-faint); cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

    @media (max-width: 760px) {
      #layout { flex-direction: column; }
      #sidebar { width: 100%; position: static; border-right: 0; border-bottom: 1px solid var(--card-border); display: flex; gap: 6px; overflow-x: auto; padding: 10px; }
      #sidebar .heading { display: none; }
      .mod-row { flex-direction: column; align-items: flex-start; min-width: 120px; margin-bottom: 0; }
      #main { padding: 14px; }
      .detail-head { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true">AI</div>
      <div style="min-width:0">
        <h1>attak-iot-firmware</h1>
        <div class="tag">bảng điều khiển quan sát</div>
      </div>
    </div>
    <span id="connIndicator" class="connecting"><span class="led" aria-hidden="true"></span><span id="connText">Đang kết nối…</span></span>
    <button id="themeToggle" class="icon-btn" type="button" aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện sáng/tối">◐</button>
  </header>

  <div id="layout">
    <nav id="sidebar" aria-label="Danh sách module">
      <div class="heading">Module</div>
      <div id="modList"></div>
    </nav>

    <main id="main">
      <section id="overview" class="card" aria-label="Tổng quan">
        <h2 class="card-title">Tổng quan</h2>
        <div id="overviewGrid" class="stat-grid"></div>
      </section>

      <section id="detail" class="card" aria-label="Chi tiết module"></section>

      <section id="result" class="card" aria-label="Kết quả"></section>

      <section id="logSection" class="card" aria-label="Nhật ký">
        <h2 class="card-title">Nhật ký</h2>
        <div class="log-toolbar">
          <div style="min-width:120px"><select id="logFilter" aria-label="Lọc theo module"></select></div>
          <div style="min-width:120px"><select id="logType" aria-label="Lọc theo loại sự kiện"></select></div>
          <div class="grow"><input id="logSearch" type="search" placeholder="Tìm trong log…" aria-label="Tìm trong log" /></div>
          <button id="clearLog" class="btn" type="button">Xóa</button>
          <button id="exportLog" class="btn" type="button">Xuất log</button>
        </div>
        <div id="logPane" role="log" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <div id="toasts" aria-live="polite" aria-atomic="false"></div>

  <script src="/dashboard.js" defer></script>
</body>
</html>
