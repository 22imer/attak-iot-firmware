; attak-iot-firmware — ESP32-S3-N16R8 dev board (16MB flash, 8MB octal PSRAM)
;
; NOTE: `board = esp32-s3-devkitc-1` is a generic PlatformIO ESP32-S3-WROOM
; board definition used as a stand-in — PlatformIO has no exact N16R8 entry
; for this clone board. Flash size + octal PSRAM are overridden below,
; confirmed from the board's own product-listing image (see
; docs/planning/research/01-pin-mapping-findings.md).

; `native` is test-only (see below) — it has no main() to link as a
; standalone program, so keep it out of plain `pio run`. Use
; `pio test -e native` to run its tests, or `pio run -e native` never.
[platformio]
default_envs = attak-iot-firmware

[env:attak-iot-firmware]
; NCM application driver is built against this platform's Arduino 2.0.17 /
; TinyUSB 0.16 ABI. Upgrade the SDK and the driver together.
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter =
	+<*>
	-<diagnostics/>
board_build.filesystem = littlefs
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
	-DBOARD_HAS_PSRAM
	-std=gnu++17
	-Isrc
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DCFG_TUD_NCM=1
	-Iinclude
build_unflags =
	-std=gnu++11
	-DARDUINO_USB_MODE=1

lib_deps =
	nrf24/RF24 @ 1.4.11
	https://github.com/bmorcelli/IRremoteESP8266
	ESP32Async/ESPAsyncWebServer
	ESP32Async/AsyncTCP
	bblanchon/ArduinoJson
	fastled/FastLED @ ^3.10.3

; Lab build: same board/framework as attak-iot-firmware but with the disruptive
; payloads compiled in (PLAN §2.4). The default env deliberately omits
; -DENABLE_DISRUPTIVE so its catalog and binary contain no jammer/deauth/portal.
[env:attak-iot-firmware-lab]
extends = env:attak-iot-firmware
build_flags =
	${env:attak-iot-firmware.build_flags}
	-DENABLE_DISRUPTIVE

; Standalone I2C diagnostic; never link the dashboard/module firmware.
[env:i2c-scan]
extends = env:attak-iot-firmware
build_src_filter =
	-<*>
	+<diagnostics/i2c_scan.cpp>
lib_deps =

; Portable codecs, runtime and arbitration tests run on the host without ESP32
; hardware. LittleFS/WiFi/SPI/I2C/RMT backends remain firmware-only.
[env:native]
platform = native
test_framework = unity
test_build_src = true
build_flags =
	-std=gnu++17
	-Isrc
	-DENABLE_DISRUPTIVE
build_src_filter =
	-<*>
	+<core/storage_json.cpp>
	+<core/module_status_json.cpp>
	+<core/ws_command_json.cpp>
	+<core/action_catalog.cpp>
	+<core/catalog_json.cpp>
	+<core/action_params.cpp>
	+<core/action_output_json.cpp>
	+<core/radio_arbiter.cpp>
	+<core/module_runtime.cpp>
	+<core/command_queue.cpp>
	+<core/wifi_scan_result.cpp>
	+<core/nfc_frame.cpp>
	+<core/nfc_uid_format.cpp>
	+<core/ir_record.cpp>
	+<core/status_health.cpp>
	+<core/rf_record.cpp>
	+<core/nrf_spectrum.cpp>
	+<core/wifi_sniff.cpp>
	+<core/wifi_attack.cpp>
	+<core/jam_plan.cpp>
	+<core/nfc_ndef.cpp>
	+<core/nfc_tag.cpp>
	+<core/ir_tx.cpp>
	+<core/usb_dhcp.cpp>
lib_deps =
	bblanchon/ArduinoJson
