; attak-iot-firmware — ESP32-S3 (YD-ESP32-S3, VCC-GND Studio clone board)
;
; NOTE: `board = esp32-s3-devkitc-1` is a generic PlatformIO ESP32-S3-WROOM
; board definition used as a stand-in — this project targets a YD-ESP32-S3
; clone board, which is not itself a PlatformIO board entry. Flash/PSRAM
; size is left at the board-def default (do not assume N8R2 or N16R8):
; check the board's own label/silkscreen before enabling PSRAM below.

[env:attak-iot-firmware]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

; PSRAM: leave disabled until the exact module variant (quad vs octal PSRAM)
; is confirmed against the physical board. Enable with the matching
; board_build.psram_type (qspi | opi) once known.
; build_flags = -DBOARD_HAS_PSRAM

lib_deps =
	nrf24/RF24 @ 1.4.11
	https://github.com/bmorcelli/SmartRC-CC1101-Driver-Lib/
	adafruit/Adafruit PN532 @ ^1.3.3
	adafruit/Adafruit BusIO @ ^1.17.2
	https://github.com/bmorcelli/IRremoteESP8266
	ESP32Async/ESPAsyncWebServer
	ESP32Async/AsyncTCP
	bblanchon/ArduinoJson
	fastled/FastLED @ ^3.10.3
