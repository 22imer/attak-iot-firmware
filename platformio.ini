; attak-iot-firmware — ESP32-S3-N16R8 dev board (16MB flash, 8MB octal PSRAM)
;
; NOTE: `board = esp32-s3-devkitc-1` is a generic PlatformIO ESP32-S3-WROOM
; board definition used as a stand-in — PlatformIO has no exact N16R8 entry
; for this clone board. Flash size + octal PSRAM are overridden below,
; confirmed from the board's own product-listing image (see
; ../.scratch/attak-iot-firmware/research/01-pin-mapping-findings.md).

; `native` is test-only (see below) — it has no main() to link as a
; standalone program, so keep it out of plain `pio run`. Use
; `pio test -e native` to run its tests, or `pio run -e native` never.
[platformio]
default_envs = attak-iot-firmware

[env:attak-iot-firmware]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
	-DBOARD_HAS_PSRAM

lib_deps =
	nrf24/RF24 @ 1.4.11
	https://github.com/bmorcelli/SmartRC-CC1101-Driver-Lib/
	adafruit/Adafruit PN532 @ ^1.3.3
	adafruit/Adafruit BusIO @ ^1.17.2
	https://github.com/bmorcelli/IRremoteESP8266
	ESP32Async/ESPAsyncWebServer
	ESP32Async/AsyncTCP
	bblanchon/ArduinoJson
	fastled/FastLED @ ^3.10.3

; Pure-logic tests (JSON codecs) run on the host, no ESP32/hardware
; involved. Only the portable *_json.cpp files are built — everything
; else in src/ touches LittleFS/WiFi/SPI/I2C/RMT and stays ESP32-only.
[env:native]
platform = native
test_framework = unity
test_build_src = true
build_flags =
	-std=gnu++17
	-Isrc
build_src_filter =
	-<*>
	+<core/storage_json.cpp>
	+<core/module_status_json.cpp>
lib_deps =
	bblanchon/ArduinoJson
